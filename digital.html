<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서거름 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1e8d2;
    --card: #fbf4e2;
    --line: rgba(110, 80, 40, 0.18);
    --ink: #4a3420;
    --dim: #8f7656;
    --start: #6f9f4f;
    --stop: #d0714a;
    --best: #5f8c34;
    --worst: #c0583a;
    --btn: #efe1c2;
    --edge: #d8c39b;
    --clay-hi: #c99a6c;
    --clay: #a8764a;
    --clay-lo: #7d5330;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1712;
      --card: #261e17;
      --line: rgba(240, 220, 190, 0.1);
      --ink: #f2e6d4;
      --dim: #b49e84;
      --start: #8cbc56;
      --stop: #ec835c;
      --best: #9ccc64;
      --worst: #f08b66;
      --btn: #3a2e23;
      --edge: #4a3a2a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background-image: var(--grain);
    opacity: .5; mix-blend-mode: multiply;
  }
  :root {
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .3  0 0 0 0 .18  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  body {
    background: radial-gradient(ellipse 90% 60% at 50% 0%, #fbf3dd 0, transparent 70%), var(--bg);
    color: var(--ink);
    font-family: "Pretendard", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .wrap { width: 100%; max-width: 440px; }

  .title { text-align: center; margin: 0 0 16px; font-family: "Gowun Batang", serif; }
  .title h1 {
    display: inline-block; vertical-align: middle;
    margin: 0 6px; font-size: clamp(24px, 7vw, 30px); font-weight: 700;
    letter-spacing: .14em; color: #3d5a26;
    text-shadow: 0 2px 0 #fff8e2, 0 3px 6px rgba(80, 60, 20, .15);
  }
  .title .sprig { width: 40px; height: 20px; vertical-align: middle; }
  .title .sprig.flip { transform: scaleX(-1); }
  .title p { margin: 6px 0 0; font-size: 13px; letter-spacing: .28em; color: #8a6d45; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .title h1 { color: #cfe3a8; text-shadow: none; }
    :root:not([data-theme="light"]) .title p { color: #c4ab86; }
  }

  /* ---------- 무대 ---------- */
  .stage {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 26px 26px 0 0;
    overflow: hidden;
    border: 2.5px solid var(--edge);
    border-bottom: none;
    background: #05070f;
  }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: var(--grain);
    mix-blend-mode: multiply; opacity: .55;
    box-shadow: inset 0 0 50px rgba(70, 45, 15, .22);
  }
  .stage svg, .stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .stage canvas { pointer-events: none; }

  .whiteout, .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .whiteout { background: #fbe1cf; }
  .flash { background: radial-gradient(circle at 50% 30%, #fff 0 30%, #fff7d6 60%, #ffd27a 100%); }
  .flash.violet { background: radial-gradient(circle at 50% 40%, #fff 0 25%, #f1dcff 55%, #9c7bff 100%); }
  .flash.on { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  .banner {
    position: absolute; left: 0; right: 0; top: 38%;
    text-align: center;
    font-size: clamp(22px, 7vw, 32px);
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 18px rgba(255,180,80,.7);
    pointer-events: none;
    opacity: 0;
  }
  .banner.on { animation: banner 1.4s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: scale(2.2); }
    15% { opacity: 1; transform: scale(1); }
    75% { opacity: 1; transform: scale(1.04); }
    100% { opacity: 0; transform: scale(.9) translateY(-10px); }
  }

  /* 말풍선: 서거름 머리 위(왼쪽)에 붙어 다니다가, 서거름이 화면 밖으로 나가면 아래쪽에 고정 */
  .bubble {
    position: absolute; left: 12px; top: 0;
    width: 46%;
    transform: translateY(-100%);
    display: flex; align-items: center; gap: 8px;
    background: #fffaf0;
    color: #5a4029;
    border: 2px solid #e6d3b3;
    border-radius: 18px;
    padding: 8px 13px;
    font-family: "Jua", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.35;
    box-shadow: 0 4px 10px -6px rgba(0,0,0,.35);
    will-change: top;
  }
  .bubble::after {
    content: "";
    position: absolute; right: 22px; bottom: -9px;
    width: 14px; height: 14px;
    background: #fffaf0;
    border-right: 2px solid #e6d3b3;
    border-bottom: 2px solid #e6d3b3;
    transform: rotate(45deg) skew(8deg, 8deg);
    border-radius: 0 0 4px 0;
    transition: opacity .2s;
  }
  .bubble b { color: #3d2a17; font-weight: 400; }
  .stage .bubble .ava { position: static; flex: 0 0 auto; width: 26px; height: 26px; display: none; }
  .bubble.docked { width: auto; max-width: 70%; }
  .bubble.docked::after { opacity: 0; }
  .bubble.docked .ava { display: block; }
  .banner { font-family: "Jua", "Pretendard", "Malgun Gothic", sans-serif; font-weight: 400; }
  .height {
    position: absolute; bottom: 12px; right: 12px;
    background: rgba(60, 40, 18, .55);
    color: #fffaf0;
    font-family: "Jua", "Pretendard", sans-serif;
    font-size: 13px;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .arm { transform-box: fill-box; transform-origin: 50% 20%; }
  .running .arm-l { animation: wave-l .6s ease-in-out infinite; }
  .running .arm-r { animation: wave-r .6s ease-in-out infinite; }
  @keyframes wave-l { 50% { transform: rotate(-16deg) translateY(-3px); } }
  @keyframes wave-r { 50% { transform: rotate(16deg) translateY(-3px); } }

  .eyes > g { opacity: 0; }
  .idle .e-open, .running .e-happy, .paused .e-wink { opacity: 1; }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .mouth > * { opacity: 0; }
  .stage:not(.sprouted) .m-smile, .sprouted .m-o { opacity: 1; }

  .sway { transform-box: view-box; transform-origin: 0 300px; animation: sway 3.6s ease-in-out infinite; }
  .sway-1 { animation-delay: -1.2s; }
  .sway-2 { animation-delay: -2.4s; }
  @keyframes sway { 0%, 100% { transform: skewX(0deg); } 50% { transform: skewX(-7deg); } }
  .rays { animation: rays 7s ease-in-out infinite; }
  @keyframes rays { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  .seed { animation: drift 12s linear infinite; }
  .lantern { transform-box: fill-box; transform-origin: 50% 0; animation: swing 3s ease-in-out infinite alternate; }
  @keyframes swing { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .train { animation: train 24s linear infinite; }
  @keyframes train { from { transform: translateX(-120px); } to { transform: translateX(540px); } }
  .walker { animation: walkx 20s ease-in-out infinite alternate; }
  @keyframes walkx { to { transform: translateX(46px); } }
  .bob { animation: bob .9s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .leg-a, .leg-b { transform-box: fill-box; transform-origin: 50% 0; animation: leg .9s ease-in-out infinite; }
  .leg-b { animation-delay: -.45s; }
  @keyframes leg { 0%, 100% { transform: rotate(12deg); } 50% { transform: rotate(-12deg); } }
  .steam circle { transform-box: fill-box; transform-origin: center; animation: steam 3s ease-out infinite; }
  @keyframes steam { from { transform: translate(0, 0) scale(.5); opacity: .85; } to { transform: translate(8px, -26px) scale(1.8); opacity: 0; } }
  .skyl { animation: skyl 4s ease-in-out infinite alternate; }
  @keyframes skyl { to { transform: translate(4px, -9px); } }
  .ship { animation: ship 22s ease-in-out infinite alternate; }
  @keyframes ship { to { transform: translateX(60px); } }
  .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .45s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: scaleY(-.5); } }
  .prop { transform-box: fill-box; transform-origin: center; animation: prop .15s linear infinite; }
  @keyframes prop { 50% { transform: scaleY(.15); } }
  .meteor { opacity: 0; animation: meteor 3.2s ease-in infinite; }
  @keyframes meteor { 0% { opacity: 0; transform: translate(0, 0); } 8% { opacity: 1; } 40% { opacity: 0; transform: translate(90px, 44px); } 100% { opacity: 0; transform: translate(90px, 44px); } }
  @keyframes drift {
    0% { transform: translate(-30px, 20px) rotate(0); opacity: 0; }
    10% { opacity: 1; }
    50% { transform: translate(60px, -30px) rotate(25deg); }
    90% { opacity: 1; }
    100% { transform: translate(150px, -90px) rotate(-10deg); opacity: 0; }
  }

  .sweat { opacity: 0; }
  .running .sweat { animation: sweat 1.1s ease-in infinite; }
  @keyframes sweat {
    0% { opacity: 0; transform: translate(0, 0); }
    30% { opacity: .9; }
    100% { opacity: 0; transform: translate(6px, 14px); }
  }

  /* ---------- 카드 ---------- */
  .card {
    background: var(--card);
    border: 2.5px solid var(--edge);
    border-top: 1.5px dashed var(--edge);
    border-radius: 0 0 26px 26px;
    padding: 22px 22px 20px;
    box-shadow: 0 24px 40px -28px rgba(61, 42, 23, .55);
  }
  .time {
    font-family: "Gowun Batang", ui-monospace, Consolas, serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(46px, 14vw, 66px);
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .time { color: var(--ink); text-shadow: 0 2px 0 rgba(120, 85, 40, .12); }
  .time .ms { color: var(--dim); font-size: 0.55em; }
  .time .d { display: inline-block; width: .62em; text-align: center; }
  .time .c { display: inline-block; width: .3em; text-align: center; }
  .lap-now {
    text-align: center; color: var(--dim);
    font-family: ui-monospace, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    margin-top: 8px; height: 1.2em; font-size: 14px;
  }
  .buttons { display: flex; gap: 12px; margin-top: 18px; }
  button {
    flex: 1;
    font-family: "Jua", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 19px; font-weight: 400;
    padding: 15px 0;
    border-radius: 999px;
    border: none; cursor: pointer;
    background: var(--btn); color: var(--ink);
    border: 2px solid rgba(80, 55, 25, .28);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), inset 0 3px 0 rgba(255,255,255,.35);
    transition: transform .08s, opacity .15s;
  }
  button:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  #toggle { background: var(--start); color: #fff; }
  #toggle.running { background: var(--stop); }
  .hint { text-align: center; color: var(--dim); font-size: 13px; margin-top: 12px; font-family: "Jua", "Pretendard", sans-serif; }
  kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

  .laps { margin: 18px 0 0; list-style: none; padding: 0; }
  .laps li {
    display: flex; align-items: center;
    padding: 12px 10px;
    border-bottom: 1px dashed var(--line);
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 15px;
    animation: drop .3s ease-out;
  }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
  .laps li span { flex: 1; }
  .laps li span:not(:first-child) { text-align: right; }
  .laps .n { color: var(--dim); font-family: "Jua", "Malgun Gothic", sans-serif; font-size: 16px; }
  .laps .split { color: var(--dim); }
  .laps li.best .lap { color: var(--best); font-weight: 700; }
  .laps li.worst .lap { color: var(--worst); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="title">
    <svg class="sprig" viewBox="0 0 40 20" aria-hidden="true"><path d="M2 14 C12 14 24 10 38 4" stroke="#6b8a3a" stroke-width="1.6" fill="none"/><path d="M12 13 q-2 -8 4 -10 q1 7 -4 10z M22 10 q0 -8 6 -9 q0 7 -6 9z M30 7 q2 -6 7 -6 q-2 6 -7 6z" fill="#7fa64a"/></svg>
    <h1>서거름 스탑워치</h1>
    <svg class="sprig flip" viewBox="0 0 40 20" aria-hidden="true"><path d="M2 14 C12 14 24 10 38 4" stroke="#6b8a3a" stroke-width="1.6" fill="none"/><path d="M12 13 q-2 -8 4 -10 q1 7 -4 10z M22 10 q0 -8 6 -9 q0 7 -6 9z M30 7 q2 -6 7 -6 q-2 6 -7 6z" fill="#7fa64a"/></svg>
    <p>작은 거름 하나가 하늘까지 자라는 시간</p>
  </header>
  <div class="stage idle" id="stage">
    <svg viewBox="0 0 400 300" aria-label="서거름의 입에서 자라 우주와 은하계까지 뻗는 나무">
      <defs>
        <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="270" x2="0" y2="-3700">
          <stop offset="0" stop-color="#ffd99a"/>
          <stop offset=".015" stop-color="#ffb07e"/>
          <stop offset=".045" stop-color="#e98a8c"/>
          <stop offset=".1" stop-color="#b47aa6"/>
          <stop offset=".2" stop-color="#7a6fae"/>
          <stop offset=".34" stop-color="#4f5ea6"/>
          <stop offset=".48" stop-color="#36478e"/>
          <stop offset=".62" stop-color="#2d62b2"/>
          <stop offset=".78" stop-color="#1f3079"/>
          <stop offset=".9" stop-color="#14194b"/>
          <stop offset="1" stop-color="#080a18"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c08e"/><stop offset=".45" stop-color="#d996a0"/><stop offset="1" stop-color="#8a74ae"/></linearGradient>
        <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6d07a"/><stop offset=".35" stop-color="#7fb35a"/><stop offset="1" stop-color="#5d8f44"/></linearGradient>
        <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aae5a"/><stop offset=".3" stop-color="#6c8a42"/><stop offset="1" stop-color="#465f32"/></linearGradient>
        <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7e9a4a"/><stop offset=".3" stop-color="#58753a"/><stop offset="1" stop-color="#34492a"/></linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#fff2c4" stop-opacity=".95"/>
          <stop offset=".35" stop-color="#ffc27a" stop-opacity=".45"/>
          <stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="clay" cx="38%" cy="30%" r="75%">
          <stop offset="0" stop-color="var(--clay-hi)"/>
          <stop offset=".55" stop-color="var(--clay)"/>
          <stop offset="1" stop-color="var(--clay-lo)"/>
        </radialGradient>
        <radialGradient id="clayArm" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="var(--clay-hi)"/>
          <stop offset="1" stop-color="var(--clay-lo)"/>
        </radialGradient>
        <radialGradient id="earthSea" cx="40%" cy="30%" r="70%">
          <stop offset="0" stop-color="#4fa3e8"/>
          <stop offset=".7" stop-color="#1f5fb0"/>
          <stop offset="1" stop-color="#123a7a"/>
        </radialGradient>
        <clipPath id="earthClip"><circle id="earthClipCircle" cx="200" cy="1500" r="1200"/></clipPath>
        <radialGradient id="shade" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
          <stop offset=".6" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".45"/>
        </radialGradient>
        <radialGradient id="neb1"><stop offset="0" stop-color="#b56cff" stop-opacity=".55"/><stop offset="1" stop-color="#b56cff" stop-opacity="0"/></radialGradient>
        <radialGradient id="neb2"><stop offset="0" stop-color="#ff6fae" stop-opacity=".45"/><stop offset="1" stop-color="#ff6fae" stop-opacity="0"/></radialGradient>
        <radialGradient id="neb3"><stop offset="0" stop-color="#5fb6ff" stop-opacity=".5"/><stop offset="1" stop-color="#5fb6ff" stop-opacity="0"/></radialGradient>
        <radialGradient id="core"><stop offset="0" stop-color="#fff8e0"/><stop offset=".35" stop-color="#ffd98a" stop-opacity=".85"/><stop offset="1" stop-color="#ff9f5a" stop-opacity="0"/></radialGradient>
      </defs>

      <!-- 뒤쪽 월드: 하늘, 장식 -->
      <g class="cam">
        <rect x="-60" y="-200000" width="520" height="200400" fill="url(#sky)"/>
        <circle cx="70" cy="200" r="300" fill="url(#sunGlow)"/>
        <g class="rays" fill="#ffe2a8">
          <path d="M70 200 L460 40 L460 90 Z" opacity=".14"/>
          <path d="M70 200 L330 -80 L260 -80 Z" opacity=".12"/>
          <path d="M70 200 L120 -80 L70 -80 Z" opacity=".1"/>
          <path d="M70 200 L460 150 L460 175 Z" opacity=".1"/>
        </g>
        <circle cx="70" cy="200" r="40" fill="#ffd28e" opacity=".45"/>
        <circle cx="70" cy="200" r="22" fill="#fff1c8"/>
        <g id="decorBack"></g>
      </g>

      <!-- 우주 배경 (화면 고정 + 시차 스크롤) -->
      <rect id="spaceTint" x="-10" y="-10" width="420" height="320" fill="#2a1450" opacity="0"/>
      <g id="stars"></g>
      <g id="nebula"></g>
      <g id="galaxyView" opacity="0"><g id="galaxyInner"></g></g>
      <g id="planets"></g>

      <!-- 우주에서 내려다본 지구 -->
      <g id="earth" opacity="0">
        <circle id="earthGlow" cx="200" cy="1500" r="1216" fill="#7fc4ff" opacity=".35"/>
        <circle id="earthBody" cx="200" cy="1500" r="1200" fill="url(#earthSea)"/>
        <g clip-path="url(#earthClip)" id="earthLand"></g>
      </g>

      <!-- 앞쪽 월드: 땅, 서거름, 나무, 앞 구름 -->
      <g class="cam">
        <!-- 노을빛 얕은 바다 -->
        <rect x="-60" y="226" width="520" height="60" fill="url(#sea)"/>
        <path d="M-60 226 C20 220 40 222 90 225 L-60 228Z M240 226 C280 219 300 220 330 224 L240 227Z" fill="#8e6f9e" opacity=".8"/>
        <g id="seaShine"></g>
        <g id="pagoda"></g>
        <g id="rail"></g>
        <g id="walker"></g>
        <!-- 언덕 2, 3 -->
        <path d="M-60 258 C60 245 140 262 220 254 C300 246 360 259 460 250 L460 420 L-60 420 Z" fill="url(#hill2)" stroke="#f3b878" stroke-width="1.6"/>
        <path d="M-60 258 C20 250 60 252 100 255 C70 262 20 264 -60 266 Z" fill="#e9b872" opacity=".45"/>
        <path d="M-60 282 C80 271 200 290 320 278 C380 273 420 280 460 277 L460 420 L-60 420 Z" fill="url(#hill3)" stroke="#d99a62" stroke-width="1.4"/>
        <g id="bushes"></g>
        <g id="meadow"></g>
        <ellipse cx="200" cy="257" rx="84" ry="9" fill="#2a4a1e" opacity=".3"/>

        <g id="mascot" transform="translate(30 59)">
          <defs>
            <path id="bodyShape" d="M170 52 c10 0 16 -10 13 -22 c12 6 16 20 10 30 c44 10 70 46 70 86 c0 36 -40 52 -93 52 s-93 -16 -93 -52 c0 -50 40 -94 93 -94 z"/>
            <clipPath id="bodyClip"><use href="#bodyShape"/></clipPath>
          </defs>
          <!-- 셀 셰이딩: 그림자색 위에 밝은 면을 비켜 얹어 경계가 또렷한 음영 -->
          <use href="#bodyShape" fill="#7a4d2b"/>
          <g clip-path="url(#bodyClip)">
            <use href="#bodyShape" fill="#a9703f" transform="translate(-16 -12)"/>
            <path d="M84 120 C100 70 150 52 200 60 C160 64 118 84 100 128 Z" fill="#c28a55"/>
            <ellipse cx="126" cy="86" rx="20" ry="8" transform="rotate(-32 126 86)" fill="#e2b07c"/>
            <ellipse cx="152" cy="68" rx="6" ry="3" transform="rotate(-20 152 68)" fill="#f3d1a0"/>

<script>
  const $ = id => document.getElementById(id);
  const $time = $('time'), $lapNow = $('lapNow'), $toggle = $('toggle'), $lap = $('lap'),
        $laps = $('laps'), $stage = $('stage'), $bubble = $('bubble'), $height = $('height'),
        $tree = $('tree'), $lip = $('lip'), $banner = $('banner'), $flash = $('flash'),
        $whiteout = $('whiteout'), $earth = $('earth'), $ring = $('ring'), $fx = $('fx'),
        $stars = $('stars'), $planets = $('planets'), $nebula = $('nebula'),
        $galaxyView = $('galaxyView'), $galaxyInner = $('galaxyInner'), $spaceTint = $('spaceTint');
  const cams = document.querySelectorAll('.cam');

  /* ---------- 스탑워치 상태 ---------- */
  let running = false, startAt = 0, elapsed = 0, laps = [], lapHeights = [], lastLapTotal = 0;
  const now = () => running ? elapsed + (performance.now() - startAt) : elapsed;

  function fmt(ms, html) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const p = n => String(n).padStart(2, '0');
    const main = (h ? h + ':' : '') + p(m) + ':' + p(s);
    // 세리프 숫자는 폭이 제각각이라, 한 글자씩 고정폭 칸에 넣어 흔들리지 않게 함
    const cells = str => [...str].map(c => `<span class="${c === ':' || c === '.' ? 'c' : 'd'}">${c}</span>`).join('');
    return html ? `${cells(main)}<span class="ms">${cells('.' + p(cs))}</span>` : `${main}.${p(cs)}`;
  }

  /* ---------- 성장 곡선 ----------
     0~10초  : 점점 가속하며 땅 → 하늘 → 구름 → 대기권 돌파
     10~20초 : 더 빨라지며 달 → 화성 → 목성 → 토성 → 천왕성 → 해왕성 → 은하수 → 은하계 돌파
     20초~   : 관성으로 감속, 이후 우주에서 천천히 계속 자람 (1시간에 안드로메다) */
  const BASE_X = 201, BASE_Y = 205;
  const ATMO = 3600, LAUNCH = 10, POW = 2.2, TAU = 0.7;
  const V_END = ATMO * POW / LAUNCH;   // 대기권 돌파 속도 ≈ 792 px/s
  const ACC = 30;                      // 우주 구간 가속도
  const H20 = ATMO + V_END * 10 + ACC * 100;
  const V20 = V_END + 2 * ACC * 10;

  function growth(ms) {
    const t = ms / 1000;
    if (t <= LAUNCH) return ATMO * Math.pow(t / LAUNCH, POW);
    if (t <= 20) { const d = t - LAUNCH; return ATMO + V_END * d + ACC * d * d; }
    const e = t - 20;
    return H20 + V20 * TAU * (1 - Math.exp(-e / TAU)) + 40 * Math.sqrt(e);
  }
  const hAt = d => growth((LAUNCH + d) * 1000);   // 대기권 돌파 d초 후 높이
  const FAR_H = growth(3600 * 1000);
  const yAt = h => BASE_Y - h;
  const camFor = h => h - 115;                     // 이 높이일 때 카메라 위치

  /* ---------- 고도 표시 ---------- */
  const LY = 9.461e12;   // 1광년(km)
  const AU = 1.496e8;
  const ALT_M = [[0, 0], [250, 8], [700, 300], [1300, 2000], [1500, 3000], [1900, 7000], [2600, 20000], [ATMO, 100000]];
  const ALT_KM = [                      // 대기권 밖은 로그 보간 (km)
    [ATMO, 100], [ATMO + 250, 400], [hAt(1.0), 384400], [hAt(2.3), 7.8e7], [hAt(3.8), 6.3e8],
    [hAt(5.3), 1.28e9], [hAt(6.6), 2.7e9], [hAt(7.3), 4.4e9], [hAt(8.0), 1.8e10],
    [hAt(8.6), 4.2 * LY], [hAt(9.4), 2000 * LY], [H20, 100000 * LY], [FAR_H, 2.5e6 * LY],
  ];
  function lerpTable(tab, h, log) {
    if (h <= tab[0][0]) return tab[0][1];
    for (let i = 1; i < tab.length; i++) {
      if (h <= tab[i][0]) {
        const [h0, a0] = tab[i - 1], [h1, a1] = tab[i], f = (h - h0) / (h1 - h0);
        return log ? Math.exp(Math.log(a0) + (Math.log(a1) - Math.log(a0)) * f) : a0 + (a1 - a0) * f;
      }
    }
    return tab[tab.length - 1][1];
  }
  function distText(h) {
    if (h < ATMO) {
      const m = lerpTable(ALT_M, h);
      return m < 1000 ? `${m.toFixed(m < 10 ? 1 : 0)}m` : `${Math.round(m / 1000).toLocaleString()}km`;
    }
    const km = lerpTable(ALT_KM, h, true);
    if (km < 1e8) return `${Math.round(km).toLocaleString()}km`;
    if (km < 0.5 * LY) { const au = km / AU; return `${au < 10 ? au.toFixed(1) : Math.round(au).toLocaleString()}AU`; }
    const ly = km / LY;
    return `${ly < 10 ? ly.toFixed(1) : Math.round(ly).toLocaleString()}광년`;
  }
  function altLabel(h) {
    const icon = h < 250 ? '🌱' : h < ATMO ? '🌳' : h < hAt(8.0) ? '🚀' : '🌌';
    return `${icon} ${distText(h)}`;
  }

  /* ---------- 유틸 ---------- */
  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const bump = (x, a, b, fade) => clamp01((x - a) / fade) * clamp01((b - x) / fade);
  const mix = (a, b, t) => {
    t = clamp01(t);
    const pa = a.match(/\w\w/g).map(x => parseInt(x, 16)), pb = b.match(/\w\w/g).map(x => parseInt(x, 16));
    return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
  };
  // 지브리풍 뭉게구름: 푸른 그림자 + 흰 몸통 + 햇빛 받은 하이라이트
  const PUFFS = [[0, 0, 42, 14], [-22, -10, 19, 16], [6, -19, 25, 23], [30, -7, 18, 15], [-38, -2, 13, 10], [20, -26, 14, 12]];
  const puffs = (dx, dy, s) => PUFFS.map(([x, y, rx, ry]) =>
    `<ellipse cx="${x + dx}" cy="${y + dy}" rx="${rx * s}" ry="${ry * s}"/>`).join('');
  const cloud = (x, y, k, o = 1) =>
    `<g opacity="${o}" transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) scale(${k.toFixed(2)})">
      <g fill="#8c6fa6">${puffs(0, 0, 1)}</g>
      <g fill="#e39a9e">${puffs(-3, -5, .93)}</g>
      <g fill="#ffcfa6">${puffs(-6, -9, .8)}</g>
      <g fill="#fff0cc" opacity=".85">${puffs(-9, -12, .55)}</g></g>`;

  /* ---------- 대기권 안쪽 장식 (월드 좌표) ---------- */
  (function buildDecor() {
    const r = rng(7);
    let back = '', front = '';
    // 지평선 위로 솟은 커다란 적란운
    back += cloud(300, 226, 2.8) + cloud(350, 196, 2.2) + cloud(290, 166, 1.9) + cloud(334, 128, 1.6) + cloud(304, 92, 1.3) + cloud(330, 62, .9);
    back += cloud(-10, 150, 1.4, .9) + cloud(150, 120, 1.1, .85);
    back += cloud(160, 60, .75, .9) + cloud(205, 36, .5, .8);

    // 바람에 흔들리는 풀 (세 무리로 나눠 물결치듯)
    const blade = (x, y, hgt, lean, c) =>
      `<path d="M${(x - 1.6).toFixed(1)} ${y} Q${(x + lean * .4).toFixed(1)} ${(y - hgt * .6).toFixed(1)} ${(x + lean).toFixed(1)} ${(y - hgt).toFixed(1)} Q${(x + lean * .4 + 1.4).toFixed(1)} ${(y - hgt * .55).toFixed(1)} ${(x + 1.6).toFixed(1)} ${y}Z" fill="${c}"/>`;
    const greens = ['#4d6e30', '#5f803a', '#738f40', '#a3a85a', '#3d5a2a'];
    const groups = ['', '', ''];
    for (let i = 0; i < 150; i++) {
      const x = -30 + r() * 460, y = 262 + r() * 40;
      if (Math.abs(x - 200) < 70 && y < 268) continue;
      groups[i % 3] += blade(x, y.toFixed(1), 8 + r() * 14, 4 + r() * 7, greens[Math.floor(r() * greens.length)]);
    }
    let meadow = groups.map((g, i) => `<g class="sway sway-${i}">${g}</g>`).join('');
    for (let i = 0; i < 22; i++) {
      const x = -10 + r() * 420, y = 262 + r() * 34, c = ['#fffaf0', '#ffe27a', '#f7b9cb', '#c9b8f0', '#fffaf0'][i % 5];
      meadow += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><path d="M0 0 q1 5 0 9" stroke="#4d8a34" stroke-width="1"/>${[0, 72, 144, 216, 288].map(a => `<ellipse cx="0" cy="-2.4" rx="1.4" ry="2" fill="${c}" stroke="#a08868" stroke-width=".3" transform="rotate(${a})"/>`).join('')}<circle r="1.2" fill="#f0a830"/></g>`;
    }
    $('meadow').innerHTML = meadow;

    // 서거름 발치 앞풀
    let grass = '';
    for (let x = 112; x < 292; x += 5 + r() * 6) grass += blade(x, (260 + r() * 5).toFixed(1), 7 + r() * 9, 3 + r() * 5, greens[Math.floor(r() * 4)]);
    $('grassFront').innerHTML = `<g class="sway sway-1">${grass}</g>`;

    // 언덕 위 덤불 (셀 셰이딩)
    const bush = (x, y, k) => `<g transform="translate(${x} ${y}) scale(${k})">
      <g fill="#3f7a2c" stroke="#2c5520" stroke-width="1.2"><circle cx="0" cy="0" r="10"/><circle cx="-10" cy="4" r="7"/><circle cx="10" cy="4" r="7"/></g>
      <g fill="#6aa846"><circle cx="-2" cy="-3" r="7"/><circle cx="-11" cy="2" r="4"/></g>
      <circle cx="-4" cy="-6" r="3" fill="#a9d36a"/></g>`;
    $('bushes').innerHTML = bush(24, 258, 1.1) + bush(392, 254, 1.25) + bush(362, 260, .8);

    // 물결 반짝임 + 해 그림자 기둥
    let shine = '';
    for (let i = 0; i < 26; i++) {
      const x = -40 + r() * 460, y = 230 + r() * 26, w = 6 + r() * 18;
      shine += `<path d="M${x.toFixed(0)} ${y.toFixed(0)} h${w.toFixed(0)}" stroke="#ffe9c4" stroke-width="1" opacity="${(.3 + r() * .4).toFixed(2)}" stroke-linecap="round"/>`;
    }
    for (let y = 229; y < 258; y += 3) shine += `<path d="M${(56 + (y - 229) * .2).toFixed(0)} ${y} h${(28 - (y - 229) * .4).toFixed(0)}" stroke="#fff2c4" stroke-width="1.4" opacity=".7" stroke-linecap="round"/>`;
    $('seaShine').innerHTML = shine;

    // 물 위의 탑 (여러 겹 지붕, 불 켜진 창)
    let P = `<ellipse cx="0" cy="2" rx="36" ry="5" fill="#5c4a6a"/>`;
    for (let i = 0; i < 4; i++) {
      const w = 46 - i * 9, yb = -i * 15;
      P += `<rect x="${-w / 2 + 3}" y="${yb - 10}" width="${w - 6}" height="10" fill="#efc896" stroke="#5a2a1e" stroke-width=".8"/>`;
      for (let wx = -w / 2 + 6; wx < w / 2 - 6; wx += 6) P += `<rect x="${wx}" y="${yb - 8}" width="3.4" height="5" fill="#ffd36e"/>`;
      P += `<path d="M${-w / 2 - 5} ${yb - 9} Q0 ${yb - 16} ${w / 2 + 5} ${yb - 9} L${w / 2 - 1} ${yb - 13} Q0 ${yb - 19} ${-w / 2 + 1} ${yb - 13}Z" fill="#c64a2e" stroke="#4a2018" stroke-width=".8"/>`;
    }
    P += `<path d="M0 -72 v-10" stroke="#4a2018" stroke-width="1.4"/><circle cy="-84" r="2" fill="#e8b04a"/>`;
    P += `<rect x="14" y="-52" width="4" height="12" fill="#6a4a3a"/><g class="steam" fill="#f8e6ea">${[0, 1, 2].map(i => `<circle cx="16" cy="-56" r="3" style="animation-delay:-${i}s"/>`).join('')}</g>`;
    $('pagoda').innerHTML = `<g transform="translate(345 232)">${P}</g><g transform="translate(345 234) scale(1 -.5)" opacity=".25">${P}</g>`;

    // 물에 잠긴 철길과 미끄러지듯 달리는 기차
    let rail = `<path d="M-60 245 H460" stroke="#4b3d5a" stroke-width="1.2" opacity=".8"/>`;
    for (let x = -60; x < 460; x += 16) rail += `<path d="M${x} 245 v4" stroke="#4b3d5a" stroke-width="1" opacity=".6"/>`;
    const car = dx => `<g transform="translate(${dx} 0)">
      <rect x="0" y="-14" width="34" height="13" rx="3" fill="#2f5f6c" stroke="#1d3940" stroke-width=".9"/>
      <rect x="-1" y="-16" width="36" height="3.5" rx="1.5" fill="#1d3940"/>
      ${[4, 11, 18, 25].map(wx => `<rect x="${wx}" y="-11" width="5" height="5" rx="1" fill="#ffd36e"/>`).join('')}</g>`;
    rail += `<g transform="translate(0 244)"><g class="train">${car(0)}${car(37)}<circle cx="72" cy="-6" r="1.6" fill="#fff4c4"/>
      <g transform="scale(1 -.6) translate(0 2)" opacity=".28">${car(0)}${car(37)}</g></g></g>`;
    $('rail').innerHTML = rail;

    // 증기를 뿜으며 걷는 작은 오두막 (직접 디자인)
    $('walker').innerHTML = `<g transform="translate(36 246)"><g class="walker"><g class="bob">
      <path class="leg-a" d="M-8 -30 L-15 -15 L-9 0" stroke="#3e3240" stroke-width="3" fill="none" stroke-linejoin="round"/>
      <path class="leg-b" d="M8 -30 L15 -15 L9 0" stroke="#3e3240" stroke-width="3" fill="none" stroke-linejoin="round"/>
      <rect x="-22" y="-57" width="40" height="28" rx="3" fill="#8b7f92" stroke="#2f2634" stroke-width="1.1"/>
      <rect x="-31" y="-51" width="12" height="17" rx="2" fill="#b07a5a" stroke="#2f2634" stroke-width="1"/>
      <rect x="14" y="-47" width="12" height="12" rx="2" fill="#6f8a8f" stroke="#2f2634" stroke-width="1"/>
      <path d="M-25 -57 L-6 -72 L13 -57Z" fill="#6d4a4a" stroke="#2f2634" stroke-width="1"/>
      <path d="M2 -61 L14 -74 L25 -59Z" fill="#4f6a7a" stroke="#2f2634" stroke-width="1"/>
      <rect x="-15" y="-51" width="7" height="7" fill="#ffd36e" stroke="#2f2634" stroke-width=".7"/>
      <circle cx="6" cy="-44" r="4" fill="#ffd36e" stroke="#2f2634" stroke-width=".9"/>
      <rect x="-28" y="-46" width="5" height="5" fill="#ffd36e"/>
      <path d="M-22 -34 h40" stroke="#2f2634" stroke-width=".8" opacity=".6"/>
      <rect x="8" y="-84" width="5" height="14" fill="#4a3e48" stroke="#2f2634" stroke-width=".8"/>
      <g class="steam" fill="#efe3ea">${[0, 1, 2].map(i => `<circle cx="10.5" cy="-88" r="3.2" style="animation-delay:-${i}s"/>`).join('')}</g>
    </g></g></g>`;

    // 하늘에 걸린 붉은 등롱 줄
    const L0 = [130, -8], L1 = [275, 50], L2 = [432, 2];
    const q = (t, i) => (1 - t) ** 2 * L0[i] + 2 * (1 - t) * t * L1[i] + t * t * L2[i];
    let lan = `<path d="M${L0[0]} ${L0[1]} Q${L1[0]} ${L1[1]} ${L2[0]} ${L2[1]}" stroke="#3d2a20" stroke-width="1" fill="none"/>`;
    for (let t = .1; t < .95; t += .13) {
      const x = q(t, 0), y = q(t, 1);
      lan += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="lantern" style="animation-delay:-${(t * 3).toFixed(1)}s">
        <path d="M0 0 v5" stroke="#3d2a20" stroke-width=".8"/>
        <circle cy="15" r="15" fill="#ffae5a" opacity=".22"/>
        <rect x="-4" y="4" width="8" height="2.4" rx="1" fill="#3a2418"/>
        <ellipse cy="15" rx="8" ry="9.5" fill="#d8432a" stroke="#5a1e14" stroke-width=".8"/>
        <ellipse cy="15" rx="4" ry="7" fill="#ffb86a" opacity=".55"/>
        <path d="M-7.6 12 h15.2 M-8 15 h16 M-7.6 18 h15.2" stroke="#8a2a1a" stroke-width=".5" opacity=".7"/>
        <rect x="-4" y="23.6" width="8" height="2.4" rx="1" fill="#3a2418"/>
        <path d="M0 26 v6" stroke="#c8902a" stroke-width="1.2"/></g></g>`;
    }
    $('lanterns').innerHTML = lan;

  function drawStars(camY, alt, gal, tSec) {

  /* ---------- 행성 (시차 레이어) ---------- */

  /* ---------- 은하수 성운 (시차 레이어) ---------- */
  const N_PAR = 0.55;

  /* ---------- 밖에서 본 우리 은하 ---------- */
  (function buildGalaxy() {

  const swayX = (y, h) => BASE_X + Math.sin((BASE_Y - y) * 0.018) * Math.min(8, h * 0.03);

  function drawTree(h, tSec, camY) {
    if (h < 1) { $tree.innerHTML = ''; $lip.setAttribute('opacity', 0); return; }

      if (y0 < viewTop) break;
      const L = Math.min(b.maxL, age * 0.9);

      const x1 = x0 + b.side * L * Math.cos(b.ang), y1 = y0 - L * Math.sin(b.ang);

      const lr = Math.min(30, 7 + L * 0.34);

      s += `<g transform="translate(${cx} ${cy})">

  /* ---------- 지구 / 우리 은하 전경 ---------- */
  const earthEls = ['earthGlow', 'earthBody', 'earthClipCircle'].map($);
  function drawEarth(alt) {

    if (o <= 0) return;
    const R = 1400 / (1 + Math.max(0, far) / 250) + 40;
    const top = 210 + Math.min(60, Math.max(0, far) * 0.05);
    const cy = top + R;
    earthEls[0].setAttribute('cy', cy); earthEls[0].setAttribute('r', R + 10 + R * 0.012);
    earthEls[1].setAttribute('cy', cy); earthEls[1].setAttribute('r', R);
    earthEls[2].setAttribute('cy', cy); earthEls[2].setAttribute('r', R);
    const k = R / 1200;
    $('earthLandInner').setAttribute('transform',
      `translate(200 ${top}) scale(${k.toFixed(3)}) translate(-200 -260) rotate(${(performance.now() / 1000 * 0.6).toFixed(2)} 200 1200)`);
  }
  const H_GAL_OUT = hAt(9.6);
  function drawGalaxyView(alt, tSec) {
    const o = clamp01((alt - camFor(H_GAL_OUT)) / 900);
    $galaxyView.setAttribute('opacity', o.toFixed(3));
    if (o <= 0) return;
    const far = Math.max(0, alt - camFor(H20));
    const k = 2.6 / (1 + far / 600) + 0.55;
    const cy = 250 + 40 / (1 + far / 400);
    $galaxyInner.setAttribute('transform',
      `translate(200 ${cy.toFixed(1)}) scale(${k.toFixed(3)}) scale(1 .42) rotate(${(tSec * 3).toFixed(2)})`);
  }

  /* ---------- 속도선 ---------- */
  const ctx = $fx.getContext('2d');
  const streaks = Array.from({ length: 52 }, () => ({ x: Math.random(), y: Math.random(), l: .4 + Math.random() * .6 }));
  function drawFx(v, dt, alt, gal) {
    const W = $fx.clientWidth, H = $fx.clientHeight, dpr = devicePixelRatio || 1;
    if ($fx.width !== Math.round(W * dpr)) { $fx.width = Math.round(W * dpr); $fx.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const k = clamp01((v - 120) / 600);
    if (k <= 0) return;
    const scale = H / 300;
    const inCloud = alt > 1450 && alt < 1950;
    ctx.lineCap = 'round';
    for (const s of streaks) {
      s.y += Math.min(v, 1100) * dt * scale * (0.9 + s.l) / H * 1.6;
      if (s.y > 1.2) { s.y -= 1.4; s.x = Math.random(); }
      const len = (20 + Math.min(v, 1400) * 0.12) * s.l * scale;
      const x = s.x * W, y = s.y * H;
      const g = ctx.createLinearGradient(x, y - len, x, y);
      const c = gal > .2 ? (s.l > .7 ? '255,200,240' : '200,220,255') : inCloud ? '200,214,230' : '255,255,255';
      g.addColorStop(0, `rgba(${c},0)`);
      g.addColorStop(1, `rgba(${c},${(.55 * k * s.l).toFixed(3)})`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 1 + s.l * 1.5;
      ctx.beginPath(); ctx.moveTo(x, y - len); ctx.lineTo(x, y); ctx.stroke();
    }
  }

  /* ---------- 연출 이벤트 ---------- */
  function banner(text) {
    $banner.textContent = text;
    $banner.classList.remove('on'); void $banner.offsetWidth; $banner.classList.add('on');
  }
  function flash(violet) {
    $flash.classList.toggle('violet', !!violet);
    $flash.classList.remove('on'); void $flash.offsetWidth; $flash.classList.add('on');
  }
  let shakeBurst = 0, ringT = -1;

  const pass = d => hAt(d) - 110;   // 행성이 화면에 들어올 즈음
  const events = [
    { h: 1,    say: '앗, 입에서 새싹이 났어요!' },
    { h: 90,   say: '꽃이 피었어요 🌼' },
    { h: 250,  say: '어…? 멈추질 않아요?!', banner: '쑥쑥!', shake: 2 },
    { h: 300,  say: '붉은 등롱 사이로 올라가요 🏮' },
    { h: 700,  say: '날개 달린 비행선이 지나가요' },
    { h: 1250, say: '하늘 등불이 함께 떠올라요' },
    { h: 1480, banner: '구름 속으로!', shake: 4, say: '앞이 하나도 안 보여요!' },
    { h: 1960, banner: '구름 돌파!', shake: 6, flash: 1, say: '구름 바다 위예요 ☁️' },
    { h: 2600, say: '노을이 지고… 유성이 쏟아져요 🌠' },
    { h: ATMO, banner: '대기권 돌파!!', shake: 14, flash: 1, ring: true, say: '지구 밖으로 나왔어요! 🌍' },
    { h: ATMO + 250, say: '인공위성 안녕! 🛰️' },
    { h: pass(1.0), banner: '달 통과!', shake: 3, say: '달이 휙 지나가요 🌙' },
    { h: pass(2.3), banner: '화성', shake: 3, say: '붉은 행성, 화성이에요' },
    { h: pass(3.8), banner: '목성!!', shake: 6, say: '엄청 커요… 태양계 최대 행성!' },
    { h: pass(5.3), banner: '토성 🪐', shake: 4, say: '고리가 정말 멋져요' },
    { h: pass(6.6), say: '옆으로 누운 천왕성…' },
    { h: pass(7.3), say: '해왕성! 태양계 마지막 행성이에요' },
    { h: hAt(8.0), banner: '태양계 탈출!', shake: 8, flash: 1, say: '태양이 점처럼 작아졌어요 ☀️' },
    { h: hAt(8.4), banner: '은하수 속으로!', shake: 5, say: '별들이 쏟아져요 ✨' },
    { h: H20, banner: '은하계 돌파!!', shake: 16, flash: 2, ring: true, say: '우리 은하가 한눈에 보여요 🌌' },
    { h: H20 + 900, say: '이제 우주를 천천히 떠다니며 자라요' },
    { h: FAR_H - 20, banner: '안드로메다 도착 🌌', shake: 6, flash: 2, say: '1시간 동안 250만 광년을 자랐어요!' },
  ];
  let eventIdx = 0;
  function fireEvents(h) {
    while (eventIdx < events.length && h >= events[eventIdx].h) {
      const e = events[eventIdx++];
      if (!running) continue;
      if (e.say) say(e.say);
      if (e.banner) banner(e.banner);
      if (e.flash) flash(e.flash === 2);
      if (e.shake) shakeBurst = Math.max(shakeBurst, e.shake);
      if (e.ring) ringT = 0;
    }
  }

  /* ---------- 메인 루프 ---------- */
  let camY = 0, raf = 0, lastT = performance.now(), lastH = 0;
  const targetCam = h => Math.max(0, camFor(h));
  const GAL_A = camFor(hAt(8.2)), GAL_B = camFor(hAt(9.9));

  function frame() {
    const nowT = performance.now(), tSec = nowT / 1000;
    const dt = Math.min(0.1, (nowT - lastT) / 1000);
    lastT = nowT;

    const t = now();
    const h = growth(t);
    const v = running ? Math.max(0, (h - lastH) / Math.max(dt, 1e-3)) : 0;
    lastH = h;

    $time.innerHTML = fmt(t, true);
    $lapNow.textContent = laps.length ? '현재 랩 ' + fmt(t - lastLapTotal) : '';
    $height.textContent = altLabel(h);
    $stage.classList.toggle('sprouted', h >= 1);
    fireEvents(h);

    const goal = targetCam(h);
    if (running) camY = goal;
    else { camY += (goal - camY) * Math.min(1, dt * 4); if (Math.abs(goal - camY) < 0.5) camY = goal; }

    const alt = camY + 115;
    const gal = bump(camY, GAL_A, GAL_B, 500);

    shakeBurst *= Math.pow(0.04, dt);
    const amp = Math.min(alt > ATMO + 400 ? 1.2 : 3, v / 300) + shakeBurst;
    const sx = (Math.random() - .5) * amp, sy = (Math.random() - .5) * amp;
    const tr = `translate(${sx.toFixed(2)} ${(camY + sy).toFixed(2)})`;
    cams.forEach(c => c.setAttribute('transform', tr));
    $planets.setAttribute('transform', `translate(${(sx * .5).toFixed(2)} ${(camY * P_PAR).toFixed(2)})`);
    $nebula.setAttribute('transform', `translate(0 ${(camY * N_PAR).toFixed(2)})`);
    $nebula.setAttribute('opacity', gal.toFixed(3));
    $spaceTint.setAttribute('opacity', (gal * .55 + clamp01((camY - camFor(H20)) / 1500) * .25).toFixed(3));

    placeBubble(camY + sy);
    drawStars(camY, alt, gal, tSec);
    drawTree(h, tSec, camY);
    drawEarth(alt);
    drawGalaxyView(alt, tSec);
    drawFx(v, dt, alt, gal);

    const c = (alt - 1480) / 480;
    $whiteout.style.opacity = c > 0 && c < 1 ? (Math.sin(Math.PI * c) * 0.85).toFixed(3) : 0;

    if (ringT >= 0) {
      ringT += dt;
      const p = ringT / 1.2;
      if (p >= 1) { ringT = -1; $ring.innerHTML = ''; }
      else {
        const x = swayX(yAt(h), h), y = yAt(h) - 10;
        $ring.innerHTML = `<ellipse cx="${x}" cy="${y}" rx="${(20 + p * 260).toFixed(1)}" ry="${(8 + p * 90).toFixed(1)}" fill="none" stroke="#fff" stroke-width="${(6 * (1 - p)).toFixed(2)}" opacity="${(1 - p).toFixed(2)}"/>
          <ellipse cx="${x}" cy="${y}" rx="${(10 + p * 180).toFixed(1)}" ry="${(4 + p * 60).toFixed(1)}" fill="none" stroke="${gal > .1 || alt > H20 ? '#d6a8ff' : '#ffcf6a'}" stroke-width="${(4 * (1 - p)).toFixed(2)}" opacity="${(1 - p).toFixed(2)}"/>`;
      }
    }

    const settling = camY !== goal || shakeBurst > 0.05 || ringT >= 0;
    if (running || settling || alt > ATMO) raf = requestAnimationFrame(frame);
    else { raf = 0; drawFx(0, 0, alt, 0); }
  }
  const kick = () => { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } };

  function say(html) { $('bubbleText').innerHTML = html; }

  // 말풍선을 서거름 머리 위에 붙임. 머리가 화면 아래로 사라지면 아래쪽에 고정(작은 얼굴 표시)
  const HEAD_TOP = 84;   // 서거름 머리 꼭지 바로 위 (월드 y)
  function placeBubble(camY) {
    const k = $stage.clientHeight / 300;
    const anchor = (HEAD_TOP + camY) * k;
    const maxY = $stage.clientHeight - 14;
    const docked = anchor > maxY;
    $bubble.style.top = Math.min(anchor, maxY).toFixed(1) + 'px';
    $bubble.classList.toggle('docked', docked);
  }
  function setState(state) {
    $stage.classList.remove('idle', 'running', 'paused');
    $stage.classList.add(state);
  }

  /* ---------- 조작 ---------- */
  function renderLaps() {
    let best = -1, worst = -1;
    if (laps.length >= 2) {
      best = laps.indexOf(Math.min(...laps));
      worst = laps.indexOf(Math.max(...laps));
    }
    let total = 0;
    $laps.innerHTML = laps.map((d, i) => {
      total += d;
      const cls = i === best ? 'best' : i === worst ? 'worst' : '';
      return `<li class="${cls}"><span class="n">랩 ${i + 1}</span><span class="lap">${fmt(d)}</span><span class="split">${fmt(total)}</span></li>`;
    }).reverse().join('');
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startAt;
      running = false;
      setState('paused');
      say('잠깐 쉬어요. 나무도 숨 고르는 중…');
    } else {
      startAt = performance.now();
      running = true;
      setState('running');
      say(elapsed ? '다시 자라요!' : '영차… 뭔가 올라와요!');
    }
    $toggle.textContent = running ? '정지' : (elapsed ? '계속' : '시작');
    $toggle.classList.toggle('running', running);
    $lap.textContent = running || !elapsed ? '랩' : '초기화';
    $lap.disabled = !running && !elapsed;
    lastH = growth(now());
    kick();
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lastLapTotal);
    lapHeights.push(growth(t));
    lastLapTotal = t;
    renderLaps();
    say(`랩 ${laps.length} — ${distText(growth(t))} 지점에 리본을 묶었어요 🎀`);
  }

  function reset() {
    if (running) return;
    elapsed = 0; laps = []; lapHeights = []; lastLapTotal = 0; eventIdx = 0; lastH = 0;
    $toggle.textContent = '시작';
    $lap.textContent = '랩';
    $lap.disabled = true;
    renderLaps();
    setState('idle');
    say('안녕, 나는 <b>서거름</b>!<br>시작하면 꽃을 피울게요');
    kick();
  }

  $toggle.addEventListener('click', toggle);
  $lap.addEventListener('click', () => running ? lap() : reset());
  document.addEventListener('keydown', e => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'KeyL') lap();
    else if (e.code === 'KeyR') reset();
  });

  addEventListener('resize', kick);
  document.fonts && document.fonts.ready.then(kick);
  kick();
</script>
</body>
</html>
