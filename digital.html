<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서거름 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efe6d4;
    --card: #fbf6ec;
    --line: rgba(74, 48, 24, 0.12);
    --ink: #3d2a17;
    --dim: #8b7258;
    --start: #6f9a3f;
    --stop: #c8643f;
    --best: #5f8c34;
    --worst: #c0583a;
    --btn: #eadcc3;
    --clay-hi: #c99a6c;
    --clay: #a8764a;
    --clay-lo: #7d5330;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1712;
      --card: #261e17;
      --line: rgba(240, 220, 190, 0.1);
      --ink: #f2e6d4;
      --dim: #b49e84;
      --start: #8cbc56;
      --stop: #ec835c;
      --best: #9ccc64;
      --worst: #f08b66;
      --btn: #3a2e23;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .wrap { width: 100%; max-width: 440px; }

  /* ---------- 무대 ---------- */
  .stage {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 24px 24px 0 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-bottom: none;
    background: #05070f;
  }
  .stage svg, .stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .stage canvas { pointer-events: none; }

  .whiteout, .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .whiteout { background: #f4f7fa; }
  .flash { background: radial-gradient(circle at 50% 30%, #fff 0 30%, #fff7d6 60%, #ffd27a 100%); }
  .flash.violet { background: radial-gradient(circle at 50% 40%, #fff 0 25%, #f1dcff 55%, #9c7bff 100%); }
  .flash.on { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  .banner {
    position: absolute; left: 0; right: 0; top: 38%;
    text-align: center;
    font-size: clamp(22px, 7vw, 32px);
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 18px rgba(255,180,80,.7);
    pointer-events: none;
    opacity: 0;
  }
  .banner.on { animation: banner 1.4s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: scale(2.2); }
    15% { opacity: 1; transform: scale(1); }
    75% { opacity: 1; transform: scale(1.04); }
    100% { opacity: 0; transform: scale(.9) translateY(-10px); }
  }

  /* 말풍선: 서거름 머리 위(왼쪽)에 붙어 다니다가, 서거름이 화면 밖으로 나가면 아래쪽에 고정 */
  .bubble {
    position: absolute; left: 12px; top: 0;
    width: 46%;
    transform: translateY(-100%);
    display: flex; align-items: center; gap: 8px;
    background: #fffaf0;
    color: #5a4029;
    border: 2px solid #e6d3b3;
    border-radius: 18px;
    padding: 8px 13px;
    font-family: "Jua", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.35;
    box-shadow: 0 4px 10px -6px rgba(0,0,0,.35);
    will-change: top;
  }
  .bubble::after {
    content: "";
    position: absolute; right: 22px; bottom: -9px;
    width: 14px; height: 14px;
    background: #fffaf0;
    border-right: 2px solid #e6d3b3;
    border-bottom: 2px solid #e6d3b3;
    transform: rotate(45deg) skew(8deg, 8deg);
    border-radius: 0 0 4px 0;
    transition: opacity .2s;
  }
  .bubble b { color: #3d2a17; font-weight: 400; }
  .stage .bubble .ava { position: static; flex: 0 0 auto; width: 26px; height: 26px; display: none; }
  .bubble.docked { width: auto; max-width: 70%; }
  .bubble.docked::after { opacity: 0; }
  .bubble.docked .ava { display: block; }
  .banner { font-family: "Jua", "Pretendard", "Malgun Gothic", sans-serif; font-weight: 400; }
  .height {
    position: absolute; bottom: 12px; right: 12px;
    background: rgba(20, 14, 8, .55);
    color: #fff;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .arm { transform-box: fill-box; transform-origin: 50% 20%; }
  .running .arm-l { animation: wave-l .6s ease-in-out infinite; }
  .running .arm-r { animation: wave-r .6s ease-in-out infinite; }
  @keyframes wave-l { 50% { transform: rotate(-16deg) translateY(-3px); } }
  @keyframes wave-r { 50% { transform: rotate(16deg) translateY(-3px); } }

  .eyes > g { opacity: 0; }
  .idle .e-open, .running .e-happy, .paused .e-wink { opacity: 1; }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .mouth > * { opacity: 0; }
  .stage:not(.sprouted) .m-smile, .sprouted .m-o { opacity: 1; }

  .sweat { opacity: 0; }
  .running .sweat { animation: sweat 1.1s ease-in infinite; }
  @keyframes sweat {
    0% { opacity: 0; transform: translate(0, 0); }
    30% { opacity: .9; }
    100% { opacity: 0; transform: translate(6px, 14px); }
  }

  /* ---------- 카드 ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0 0 24px 24px;
    padding: 22px 22px 20px;
    box-shadow: 0 24px 40px -28px rgba(61, 42, 23, .55);
  }
  .time {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(46px, 14vw, 66px);
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .time .ms { color: var(--dim); font-size: 0.55em; }
  .lap-now {
    text-align: center; color: var(--dim);
    font-family: ui-monospace, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    margin-top: 8px; height: 1.2em; font-size: 14px;
  }
  .buttons { display: flex; gap: 12px; margin-top: 18px; }
  button {
    flex: 1;
    font: inherit; font-size: 17px; font-weight: 700;
    padding: 15px 0;
    border-radius: 999px;
    border: none; cursor: pointer;
    background: var(--btn); color: var(--ink);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.12);
    transition: transform .08s, opacity .15s;
  }
  button:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  #toggle { background: var(--start); color: #fff; }
  #toggle.running { background: var(--stop); }
  .hint { text-align: center; color: var(--dim); font-size: 12px; margin-top: 12px; }
  kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

  .laps { margin: 18px 0 0; list-style: none; padding: 0; }
  .laps li {
    display: flex; align-items: center;
    padding: 12px 10px;
    border-bottom: 1px dashed var(--line);
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 15px;
    animation: drop .3s ease-out;
  }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
  .laps li span { flex: 1; }
  .laps li span:not(:first-child) { text-align: right; }
  .laps .n { color: var(--dim); font-family: system-ui, "Malgun Gothic", sans-serif; }
  .laps .split { color: var(--dim); }
  .laps li.best .lap { color: var(--best); font-weight: 700; }
  .laps li.worst .lap { color: var(--worst); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage idle" id="stage">
    <svg viewBox="0 0 400 300" aria-label="서거름의 입에서 자라 우주와 은하계까지 뻗는 나무">
      <defs>
        <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="270" x2="0" y2="-3700">
          <stop offset="0" stop-color="#f6ecd8"/>
          <stop offset=".08" stop-color="#d6ebf3"/>
          <stop offset=".3" stop-color="#9fd0f0"/>
          <stop offset=".48" stop-color="#6fb0e6"/>
          <stop offset=".62" stop-color="#3f74c4"/>
          <stop offset=".78" stop-color="#22357a"/>
          <stop offset=".9" stop-color="#121a45"/>
          <stop offset="1" stop-color="#05070f"/>
        </linearGradient>
        <radialGradient id="clay" cx="38%" cy="30%" r="75%">
          <stop offset="0" stop-color="var(--clay-hi)"/>
          <stop offset=".55" stop-color="var(--clay)"/>
          <stop offset="1" stop-color="var(--clay-lo)"/>
        </radialGradient>
        <radialGradient id="clayArm" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="var(--clay-hi)"/>
          <stop offset="1" stop-color="var(--clay-lo)"/>
        </radialGradient>
        <radialGradient id="earthSea" cx="40%" cy="30%" r="70%">
          <stop offset="0" stop-color="#4fa3e8"/>
          <stop offset=".7" stop-color="#1f5fb0"/>
          <stop offset="1" stop-color="#123a7a"/>
        </radialGradient>
        <clipPath id="earthClip"><circle id="earthClipCircle" cx="200" cy="1500" r="1200"/></clipPath>
        <radialGradient id="shade" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
          <stop offset=".6" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".45"/>
        </radialGradient>
        <radialGradient id="neb1"><stop offset="0" stop-color="#b56cff" stop-opacity=".55"/><stop offset="1" stop-color="#b56cff" stop-opacity="0"/></radialGradient>
        <radialGradient id="neb2"><stop offset="0" stop-color="#ff6fae" stop-opacity=".45"/><stop offset="1" stop-color="#ff6fae" stop-opacity="0"/></radialGradient>
        <radialGradient id="neb3"><stop offset="0" stop-color="#5fb6ff" stop-opacity=".5"/><stop offset="1" stop-color="#5fb6ff" stop-opacity="0"/></radialGradient>
        <radialGradient id="core"><stop offset="0" stop-color="#fff8e0"/><stop offset=".35" stop-color="#ffd98a" stop-opacity=".85"/><stop offset="1" stop-color="#ff9f5a" stop-opacity="0"/></radialGradient>
      </defs>

      <!-- 뒤쪽 월드: 하늘, 장식 -->
      <g class="cam">
        <rect x="-60" y="-200000" width="520" height="200400" fill="url(#sky)"/>
        <g id="decorBack"></g>
      </g>

      <!-- 우주 배경 (화면 고정 + 시차 스크롤) -->
      <rect id="spaceTint" x="-10" y="-10" width="420" height="320" fill="#2a1450" opacity="0"/>
      <g id="stars"></g>
      <g id="nebula"></g>
      <g id="galaxyView" opacity="0"><g id="galaxyInner"></g></g>
      <g id="planets"></g>

      <!-- 우주에서 내려다본 지구 -->
      <g id="earth" opacity="0">
        <circle id="earthGlow" cx="200" cy="1500" r="1216" fill="#7fc4ff" opacity=".35"/>
        <circle id="earthBody" cx="200" cy="1500" r="1200" fill="url(#earthSea)"/>
        <g clip-path="url(#earthClip)" id="earthLand"></g>
      </g>

      <!-- 앞쪽 월드: 땅, 서거름, 나무, 앞 구름 -->
      <g class="cam">
        <path d="M-60 262 C60 254 140 266 220 260 C300 254 360 264 460 258 L460 420 L-60 420 Z" fill="#d6bf93"/>
        <path d="M-60 282 C80 274 200 290 320 280 C380 276 420 282 460 280 L460 420 L-60 420 Z" fill="#c6ab7a"/>
        <circle cx="60" cy="290" r="4" fill="#b0966a"/><circle cx="330" cy="296" r="3" fill="#b0966a"/><circle cx="110" cy="280" r="2.5" fill="#b0966a"/>
        <ellipse cx="200" cy="257" rx="80" ry="9" fill="#3d2a17" opacity=".18"/>

        <g id="mascot" transform="translate(30 59)">
          <ellipse class="arm arm-l" cx="102" cy="168" rx="26" ry="20" fill="url(#clayArm)"/>
          <ellipse class="arm arm-r" cx="238" cy="168" rx="26" ry="20" fill="url(#clayArm)"/>
          <path d="M170 52 c10 0 16 -10 13 -22 c12 6 16 20 10 30 c44 10 70 46 70 86 c0 36 -40 52 -93 52 s-93 -16 -93 -52 c0 -50 40 -94 93 -94 z" fill="url(#clay)"/>
          <path d="M118 96 q10 -10 22 -12" stroke="#fff" stroke-opacity=".18" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M226 160 q14 -6 22 -20" stroke="#000" stroke-opacity=".08" stroke-width="4" fill="none" stroke-linecap="round"/>
          <ellipse class="arm arm-l" cx="102" cy="170" rx="22" ry="16" fill="url(#clayArm)"/>
          <ellipse class="arm arm-r" cx="238" cy="170" rx="22" ry="16" fill="url(#clayArm)"/>
          <ellipse cx="124" cy="140" rx="15" ry="9" fill="#e9826d" opacity=".45"/>
          <ellipse cx="218" cy="140" rx="15" ry="9" fill="#e9826d" opacity=".45"/>
          <g class="eyes">
            <g class="e-open"><g class="blink">
              <ellipse cx="146" cy="122" rx="7" ry="9" fill="#24170c"/>
              <ellipse cx="196" cy="122" rx="7" ry="9" fill="#24170c"/>
              <circle cx="148" cy="119" r="2.4" fill="#fff"/>
              <circle cx="198" cy="119" r="2.4" fill="#fff"/>
            </g></g>
            <g class="e-happy">
              <path d="M136 124 q10 -12 20 0" stroke="#24170c" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M186 124 q10 -12 20 0" stroke="#24170c" stroke-width="4.5" fill="none" stroke-linecap="round"/>
            </g>
            <g class="e-wink">
              <ellipse cx="146" cy="122" rx="7" ry="9" fill="#24170c"/>
              <circle cx="148" cy="119" r="2.4" fill="#fff"/>
              <path d="M188 122 l16 0" stroke="#24170c" stroke-width="4.5" stroke-linecap="round"/>
            </g>
          </g>
          <g class="mouth">
            <path class="m-smile" d="M163 144 q8 6 16 0" stroke="#24170c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <ellipse class="m-o" cx="171" cy="146" rx="9" ry="7" fill="#4a2414"/>
          </g>
          <path class="sweat" d="M248 92 q8 12 0 16 q-8 -4 0 -16z" fill="#8cc6e8"/>
        </g>

        <g id="tree"></g>
        <path id="lip" d="M192 210 q9 5 18 0" stroke="#4a2414" stroke-width="3" fill="none" stroke-linecap="round" opacity="0"/>
        <g id="decorFront"></g>
        <g id="ring"></g>
      </g>
    </svg>
    <canvas id="fx"></canvas>
    <div class="whiteout" id="whiteout"></div>
    <div class="flash" id="flash"></div>
    <div class="banner" id="banner"></div>
    <div class="bubble" id="bubble">
      <svg class="ava" viewBox="0 0 40 36" aria-hidden="true">
        <path d="M20 6 c2 0 3 -2 2.5 -4.5 c2.5 1.2 3.2 4 2 6 c8 2 13 8 13 15 c0 7 -7 10 -17.5 10 s-17.5 -3 -17.5 -10 c0 -9 7 -16.5 17.5 -16.5z" fill="#a8764a"/>
        <ellipse cx="15" cy="20" rx="2" ry="2.6" fill="#24170c"/><ellipse cx="25" cy="20" rx="2" ry="2.6" fill="#24170c"/>
        <ellipse cx="11" cy="25" rx="3" ry="1.8" fill="#e9826d" opacity=".6"/><ellipse cx="29" cy="25" rx="3" ry="1.8" fill="#e9826d" opacity=".6"/>
        <ellipse cx="20" cy="26" rx="2.2" ry="1.8" fill="#4a2414"/>
      </svg>
      <span id="bubbleText">안녕, 나는 <b>서거름</b>!<br>시작하면 꽃을 피울게요</span>
    </div>
    <div class="height" id="height">🌱 0m</div>
  </div>

  <div class="card">
    <div class="time" id="time">00:00<span class="ms">.00</span></div>
    <div class="lap-now" id="lapNow"></div>
    <div class="buttons">
      <button id="lap" disabled>랩</button>
      <button id="toggle">시작</button>
    </div>
    <div class="hint"><kbd>Space</kbd> 시작/정지 · <kbd>L</kbd> 랩 · <kbd>R</kbd> 초기화</div>
  </div>
  <ul class="laps" id="laps"></ul>
</div>

<script>
  const $ = id => document.getElementById(id);
  const $time = $('time'), $lapNow = $('lapNow'), $toggle = $('toggle'), $lap = $('lap'),
        $laps = $('laps'), $stage = $('stage'), $bubble = $('bubble'), $height = $('height'),
        $tree = $('tree'), $lip = $('lip'), $banner = $('banner'), $flash = $('flash'),
        $whiteout = $('whiteout'), $earth = $('earth'), $ring = $('ring'), $fx = $('fx'),
        $stars = $('stars'), $planets = $('planets'), $nebula = $('nebula'),
        $galaxyView = $('galaxyView'), $galaxyInner = $('galaxyInner'), $spaceTint = $('spaceTint');
  const cams = document.querySelectorAll('.cam');

  /* ---------- 스탑워치 상태 ---------- */
  let running = false, startAt = 0, elapsed = 0, laps = [], lapHeights = [], lastLapTotal = 0;
  const now = () => running ? elapsed + (performance.now() - startAt) : elapsed;

  function fmt(ms, html) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const p = n => String(n).padStart(2, '0');
    const main = (h ? h + ':' : '') + p(m) + ':' + p(s);
    return html ? `${main}<span class="ms">.${p(cs)}</span>` : `${main}.${p(cs)}`;
  }

  /* ---------- 성장 곡선 ----------
     0~10초  : 점점 가속하며 땅 → 하늘 → 구름 → 대기권 돌파
     10~20초 : 더 빨라지며 달 → 화성 → 목성 → 토성 → 천왕성 → 해왕성 → 은하수 → 은하계 돌파
     20초~   : 관성으로 감속, 이후 우주에서 천천히 계속 자람 (1시간에 안드로메다) */
  const BASE_X = 201, BASE_Y = 205;
  const ATMO = 3600, LAUNCH = 10, POW = 2.2, TAU = 0.7;
  const V_END = ATMO * POW / LAUNCH;   // 대기권 돌파 속도 ≈ 792 px/s
  const ACC = 30;                      // 우주 구간 가속도
  const H20 = ATMO + V_END * 10 + ACC * 100;
  const V20 = V_END + 2 * ACC * 10;

  function growth(ms) {
    const t = ms / 1000;
    if (t <= LAUNCH) return ATMO * Math.pow(t / LAUNCH, POW);
    if (t <= 20) { const d = t - LAUNCH; return ATMO + V_END * d + ACC * d * d; }
    const e = t - 20;
    return H20 + V20 * TAU * (1 - Math.exp(-e / TAU)) + 40 * Math.sqrt(e);
  }
  const hAt = d => growth((LAUNCH + d) * 1000);   // 대기권 돌파 d초 후 높이
  const FAR_H = growth(3600 * 1000);
  const yAt = h => BASE_Y - h;
  const camFor = h => h - 115;                     // 이 높이일 때 카메라 위치

  /* ---------- 고도 표시 ---------- */
  const LY = 9.461e12;   // 1광년(km)
  const AU = 1.496e8;
  const ALT_M = [[0, 0], [250, 8], [700, 300], [1300, 2000], [1500, 3000], [1900, 7000], [2600, 20000], [ATMO, 100000]];
  const ALT_KM = [                      // 대기권 밖은 로그 보간 (km)
    [ATMO, 100], [ATMO + 250, 400], [hAt(1.0), 384400], [hAt(2.3), 7.8e7], [hAt(3.8), 6.3e8],
    [hAt(5.3), 1.28e9], [hAt(6.6), 2.7e9], [hAt(7.3), 4.4e9], [hAt(8.0), 1.8e10],
    [hAt(8.6), 4.2 * LY], [hAt(9.4), 2000 * LY], [H20, 100000 * LY], [FAR_H, 2.5e6 * LY],
  ];
  function lerpTable(tab, h, log) {
    if (h <= tab[0][0]) return tab[0][1];
    for (let i = 1; i < tab.length; i++) {
      if (h <= tab[i][0]) {
        const [h0, a0] = tab[i - 1], [h1, a1] = tab[i], f = (h - h0) / (h1 - h0);
        return log ? Math.exp(Math.log(a0) + (Math.log(a1) - Math.log(a0)) * f) : a0 + (a1 - a0) * f;
      }
    }
    return tab[tab.length - 1][1];
  }
  function distText(h) {
    if (h < ATMO) {
      const m = lerpTable(ALT_M, h);
      return m < 1000 ? `${m.toFixed(m < 10 ? 1 : 0)}m` : `${Math.round(m / 1000).toLocaleString()}km`;
    }
    const km = lerpTable(ALT_KM, h, true);
    if (km < 1e8) return `${Math.round(km).toLocaleString()}km`;

    const W = $fx.clientWidth, H = $fx.clientHeight, dpr = devicePixelRatio || 1;
    if ($fx.width !== Math.round(W * dpr)) { $fx.width = Math.round(W * dpr); $fx.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const k = clamp01((v - 120) / 600);
    if (k <= 0) return;
    const scale = H / 300;
    const inCloud = alt > 1450 && alt < 1950;
    ctx.lineCap = 'round';
    for (const s of streaks) {
      s.y += Math.min(v, 1100) * dt * scale * (0.9 + s.l) / H * 1.6;
      if (s.y > 1.2) { s.y -= 1.4; s.x = Math.random(); }
      const len = (20 + Math.min(v, 1400) * 0.12) * s.l * scale;
      const x = s.x * W, y = s.y * H;
      const g = ctx.createLinearGradient(x, y - len, x, y);
      const c = gal > .2 ? (s.l > .7 ? '255,200,240' : '200,220,255') : inCloud ? '200,214,230' : '255,255,255';
      g.addColorStop(0, `rgba(${c},0)`);
      g.addColorStop(1, `rgba(${c},${(.55 * k * s.l).toFixed(3)})`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 1 + s.l * 1.5;
      ctx.beginPath(); ctx.moveTo(x, y - len); ctx.lineTo(x, y); ctx.stroke();
    }
  }

  /* ---------- 연출 이벤트 ---------- */
  function banner(text) {
    $banner.textContent = text;
    $banner.classList.remove('on'); void $banner.offsetWidth; $banner.classList.add('on');
  }
  function flash(violet) {
    $flash.classList.toggle('violet', !!violet);
    $flash.classList.remove('on'); void $flash.offsetWidth; $flash.classList.add('on');
  }
  let shakeBurst = 0, ringT = -1;

  const pass = d => hAt(d) - 110;   // 행성이 화면에 들어올 즈음
  const events = [
    { h: 1,    say: '앗, 입에서 새싹이 났어요!' },
    { h: 90,   say: '꽃이 피었어요 🌼' },
    { h: 250,  say: '어…? 멈추질 않아요?!', banner: '쑥쑥!', shake: 2 },
    { h: 700,  say: '열기구를 지나쳐요 🎈' },
    { h: 1250, say: '비행기보다 높이! ✈️' },
    { h: 1480, banner: '구름 속으로!', shake: 4, say: '앞이 하나도 안 보여요!' },
    { h: 1960, banner: '구름 돌파!', shake: 6, flash: 1, say: '구름 바다 위예요 ☁️' },
    { h: 2600, say: '하늘이 점점 어두워져요…' },
    { h: ATMO, banner: '대기권 돌파!!', shake: 14, flash: 1, ring: true, say: '지구 밖으로 나왔어요! 🌍' },
    { h: ATMO + 250, say: '인공위성 안녕! 🛰️' },
    { h: pass(1.0), banner: '달 통과!', shake: 3, say: '달이 휙 지나가요 🌙' },
    { h: pass(2.3), banner: '화성', shake: 3, say: '붉은 행성, 화성이에요' },
    { h: pass(3.8), banner: '목성!!', shake: 6, say: '엄청 커요… 태양계 최대 행성!' },
    { h: pass(5.3), banner: '토성 🪐', shake: 4, say: '고리가 정말 멋져요' },
    { h: pass(6.6), say: '옆으로 누운 천왕성…' },
    { h: pass(7.3), say: '해왕성! 태양계 마지막 행성이에요' },
    { h: hAt(8.0), banner: '태양계 탈출!', shake: 8, flash: 1, say: '태양이 점처럼 작아졌어요 ☀️' },
    { h: hAt(8.4), banner: '은하수 속으로!', shake: 5, say: '별들이 쏟아져요 ✨' },
    { h: H20, banner: '은하계 돌파!!', shake: 16, flash: 2, ring: true, say: '우리 은하가 한눈에 보여요 🌌' },
    { h: H20 + 900, say: '이제 우주를 천천히 떠다니며 자라요' },
    { h: FAR_H - 20, banner: '안드로메다 도착 🌌', shake: 6, flash: 2, say: '1시간 동안 250만 광년을 자랐어요!' },
  ];
  let eventIdx = 0;
  function fireEvents(h) {
    while (eventIdx < events.length && h >= events[eventIdx].h) {
      const e = events[eventIdx++];
      if (!running) continue;
      if (e.say) say(e.say);
      if (e.banner) banner(e.banner);
      if (e.flash) flash(e.flash === 2);
      if (e.shake) shakeBurst = Math.max(shakeBurst, e.shake);
      if (e.ring) ringT = 0;
    }
  }

  /* ---------- 메인 루프 ---------- */
  let camY = 0, raf = 0, lastT = performance.now(), lastH = 0;
  const targetCam = h => Math.max(0, camFor(h));
  const GAL_A = camFor(hAt(8.2)), GAL_B = camFor(hAt(9.9));

  function frame() {
    const nowT = performance.now(), tSec = nowT / 1000;
    const dt = Math.min(0.1, (nowT - lastT) / 1000);
    lastT = nowT;

    const t = now();
    const h = growth(t);
    const v = running ? Math.max(0, (h - lastH) / Math.max(dt, 1e-3)) : 0;
    lastH = h;

    $time.innerHTML = fmt(t, true);
    $lapNow.textContent = laps.length ? '현재 랩 ' + fmt(t - lastLapTotal) : '';
    $height.textContent = altLabel(h);
    $stage.classList.toggle('sprouted', h >= 1);
    fireEvents(h);

    const goal = targetCam(h);
    if (running) camY = goal;
    else { camY += (goal - camY) * Math.min(1, dt * 4); if (Math.abs(goal - camY) < 0.5) camY = goal; }

    const alt = camY + 115;
    const gal = bump(camY, GAL_A, GAL_B, 500);

    shakeBurst *= Math.pow(0.04, dt);
    const amp = Math.min(alt > ATMO + 400 ? 1.2 : 3, v / 300) + shakeBurst;
    const sx = (Math.random() - .5) * amp, sy = (Math.random() - .5) * amp;
    const tr = `translate(${sx.toFixed(2)} ${(camY + sy).toFixed(2)})`;
    cams.forEach(c => c.setAttribute('transform', tr));
    $planets.setAttribute('transform', `translate(${(sx * .5).toFixed(2)} ${(camY * P_PAR).toFixed(2)})`);
    $nebula.setAttribute('transform', `translate(0 ${(camY * N_PAR).toFixed(2)})`);
    $nebula.setAttribute('opacity', gal.toFixed(3));
    $spaceTint.setAttribute('opacity', (gal * .55 + clamp01((camY - camFor(H20)) / 1500) * .25).toFixed(3));

    placeBubble(camY + sy);
    drawStars(camY, alt, gal, tSec);
    drawTree(h, tSec, camY);
    drawEarth(alt);
    drawGalaxyView(alt, tSec);
    drawFx(v, dt, alt, gal);

    const c = (alt - 1480) / 480;
    $whiteout.style.opacity = c > 0 && c < 1 ? (Math.sin(Math.PI * c) * 0.85).toFixed(3) : 0;

    if (ringT >= 0) {
      ringT += dt;
      const p = ringT / 1.2;
      if (p >= 1) { ringT = -1; $ring.innerHTML = ''; }
      else {
        const x = swayX(yAt(h), h), y = yAt(h) - 10;
        $ring.innerHTML = `<ellipse cx="${x}" cy="${y}" rx="${(20 + p * 260).toFixed(1)}" ry="${(8 + p * 90).toFixed(1)}" fill="none" stroke="#fff" stroke-width="${(6 * (1 - p)).toFixed(2)}" opacity="${(1 - p).toFixed(2)}"/>
          <ellipse cx="${x}" cy="${y}" rx="${(10 + p * 180).toFixed(1)}" ry="${(4 + p * 60).toFixed(1)}" fill="none" stroke="${gal > .1 || alt > H20 ? '#d6a8ff' : '#ffcf6a'}" stroke-width="${(4 * (1 - p)).toFixed(2)}" opacity="${(1 - p).toFixed(2)}"/>`;
      }
    }

    const settling = camY !== goal || shakeBurst > 0.05 || ringT >= 0;
    if (running || settling || alt > ATMO) raf = requestAnimationFrame(frame);
    else { raf = 0; drawFx(0, 0, alt, 0); }
  }
  const kick = () => { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } };

  function say(html) { $('bubbleText').innerHTML = html; }

  // 말풍선을 서거름 머리 위에 붙임. 머리가 화면 아래로 사라지면 아래쪽에 고정(작은 얼굴 표시)
  const HEAD_TOP = 84;   // 서거름 머리 꼭지 바로 위 (월드 y)
  function placeBubble(camY) {
    const k = $stage.clientHeight / 300;
    const anchor = (HEAD_TOP + camY) * k;
    const maxY = $stage.clientHeight - 14;
    const docked = anchor > maxY;
    $bubble.style.top = Math.min(anchor, maxY).toFixed(1) + 'px';
    $bubble.classList.toggle('docked', docked);
  }
  function setState(state) {
    $stage.classList.remove('idle', 'running', 'paused');
    $stage.classList.add(state);
  }

  /* ---------- 조작 ---------- */
  function renderLaps() {
    let best = -1, worst = -1;
    if (laps.length >= 2) {
      best = laps.indexOf(Math.min(...laps));
      worst = laps.indexOf(Math.max(...laps));
    }
    let total = 0;
    $laps.innerHTML = laps.map((d, i) => {
      total += d;
      const cls = i === best ? 'best' : i === worst ? 'worst' : '';
      return `<li class="${cls}"><span class="n">랩 ${i + 1}</span><span class="lap">${fmt(d)}</span><span class="split">${fmt(total)}</span></li>`;
    }).reverse().join('');
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startAt;
      running = false;
      setState('paused');
      say('잠깐 쉬어요. 나무도 숨 고르는 중…');
    } else {
      startAt = performance.now();
      running = true;
      setState('running');
      say(elapsed ? '다시 자라요!' : '영차… 뭔가 올라와요!');
    }
    $toggle.textContent = running ? '정지' : (elapsed ? '계속' : '시작');
    $toggle.classList.toggle('running', running);
    $lap.textContent = running || !elapsed ? '랩' : '초기화';
    $lap.disabled = !running && !elapsed;
    lastH = growth(now());
    kick();
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lastLapTotal);
    lapHeights.push(growth(t));
    lastLapTotal = t;
    renderLaps();
    say(`랩 ${laps.length} — ${distText(growth(t))} 지점에 리본을 묶었어요 🎀`);
  }

  function reset() {
    if (running) return;
    elapsed = 0; laps = []; lapHeights = []; lastLapTotal = 0; eventIdx = 0; lastH = 0;
    $toggle.textContent = '시작';
    $lap.textContent = '랩';
    $lap.disabled = true;
    renderLaps();
    setState('idle');
    say('안녕, 나는 <b>서거름</b>!<br>시작하면 꽃을 피울게요');
    kick();
  }

  $toggle.addEventListener('click', toggle);
  $lap.addEventListener('click', () => running ? lap() : reset());
  document.addEventListener('keydown', e => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'KeyL') lap();
    else if (e.code === 'KeyR') reset();
  });

  addEventListener('resize', kick);
  document.fonts && document.fonts.ready.then(kick);
  kick();
</script>
</body>
</html>
